server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Encabezados de seguridad (se heredan en las ubicaciones que usan `expires`).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  # JS y CSS: revalidar SIEMPRE. Tras un deploy el navegador toma la versión
  # nueva de inmediato (con 304 sigue siendo rápido). Evita que queden módulos
  # viejos en caché y rompan los imports entre archivos. Se usa `expires`
  # (no `add_header`) para no descartar los encabezados de seguridad heredados.
  location ~* \.(?:js|css)$ {
    expires -1;
    try_files $uri =404;
  }

  # Imágenes y fuentes: sí se pueden cachear (cambian muy poco).
  location ~* \.(?:woff2?|svg|png|ico|jpe?g)$ {
    expires 1h;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
