server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Encabezados de seguridad (se heredan en las ubicaciones que usan `expires`).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  # Cachea estáticos versionables (usa `expires`, no `add_header`, para no
  # descartar los encabezados de seguridad heredados del bloque server).
  location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
    expires 1h;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
